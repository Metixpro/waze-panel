<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1012" />
  <title>ورود · {{ cfg.PANEL_TITLE }}</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("waze-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="preload" href="/static/vendor/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/static/css/style.css?v={{ asset_v }}" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
</head>
<body>
{% from "_icons.html" import icon, logo %}
<main class="auth">
  <div class="auth-box">
    <div class="auth-brand">{{ logo() }}<span>{{ cfg.PANEL_TITLE }}</span></div>

    <div class="card auth-card">
      <h1>ورود به پنل</h1>
      <p class="sub">با حساب مدیر وارد شوید.</p>

      {% if error %}
      <div class="alert bad" style="margin-bottom:16px" role="alert">{{ icon("alert") }}<span>{{ error }}</span></div>
      {% endif %}

      <form method="post" action="/login" id="login-form">
        <div class="field">
          <label for="username">نام کاربری</label>
          <input id="username" type="text" name="username" autocomplete="username" dir="ltr" required autofocus
                 autocapitalize="off" spellcheck="false" value="{{ username or '' }}" />
        </div>
        <div class="field">
          <label for="password">رمز عبور</label>
          <div class="input-group">
            <input id="password" type="password" name="password" autocomplete="current-password" dir="ltr" required />
            <button class="btn" type="button" id="toggle-pass" title="نمایش رمز" aria-label="نمایش رمز">{{ icon("eye") }}</button>
          </div>
        </div>
        <button type="submit" class="btn primary block" id="login-btn" style="height:40px; margin-top:6px">ورود</button>
      </form>
    </div>

    <p class="auth-foot">
      رمز را فراموش کرده‌اید؟ روی سرور اجرا کنید:<br /><code>waze-panel reset-password</code>
    </p>
  </div>
</main>
<script>
  window.ICONS = null;
  var pass = document.getElementById("password");
  document.getElementById("toggle-pass").addEventListener("click", function () {
    pass.type = pass.type === "password" ? "text" : "password";
    pass.focus();
  });
  document.getElementById("login-form").addEventListener("submit", function () {
    document.getElementById("login-btn").classList.add("loading");
  });
</script>
</body>
</html>
